[build]
  publish = "dist"
  command = "npm ci && npm run build && node scripts/import-editorial-mirror.mjs"

[build.environment]
  NODE_VERSION = "22"

# Keep the editable mirror available in production. Only the OpenBot batch
# marker runs the import step after the website build succeeds.
[context.production.environment]
  EDITORIAL_CMS_SYNC = "true"

# Headers for performance — cache hashed Vite assets aggressively
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
